<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayFest 2026 - Botswana's Premier Automotive, Gaming & Music Festival</title>
    <link rel="icon" type="image/jpeg" href="/src/assets/images/playfest_favicon_1784490332136.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="/src/assets/images/playfest_favicon_1784490332136.jpg" />
    <script>
      // Forcefully suppress Vite HMR/WebSocket errors because HMR is disabled in this environment.
      (function() {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          const WrappedWebSocket = function(url, protocols) {
            // Check if this is a Vite HMR connection attempt
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('hmr') || url.includes('vite') || url.includes('ws://') || url.includes('wss://')))) {
              // Return a silent mock WebSocket that never fails or attempts to connect
              return {
                url: url,
                readyState: 3, // CLOSED state
                addEventListener: function(event, cb) {
                  // Ignore listeners, do not fire any events to prevent errors
                },
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                bufferedAmount: 0,
                extensions: "",
                protocol: protocols || "",
                binaryType: "blob"
              };
            }
            try {
              return new OrigWebSocket(url, protocols);
            } catch (err) {
              return {};
            }
          };
          WrappedWebSocket.prototype = OrigWebSocket.prototype;
          for (const key in OrigWebSocket) {
            if (Object.prototype.hasOwnProperty.call(OrigWebSocket, key)) {
              WrappedWebSocket[key] = OrigWebSocket[key];
            }
          }
          WrappedWebSocket.CONNECTING = 0;
          WrappedWebSocket.OPEN = 1;
          WrappedWebSocket.CLOSING = 2;
          WrappedWebSocket.CLOSED = 3;
          window.WebSocket = WrappedWebSocket;
        }
      })();

      window.addEventListener('unhandledrejection', function(event) {
        const msg = event.reason && (event.reason.message || event.reason);
        if (msg && typeof msg === 'string' && (
          msg.includes('WebSocket') || 
          msg.includes('websocket') || 
          msg.includes('ws://') || 
          msg.includes('wss://')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        const msg = event.message || '';
        if (msg && typeof msg === 'string' && (
          msg.includes('WebSocket') || 
          msg.includes('websocket') || 
          msg.includes('ws://') || 
          msg.includes('wss://')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
